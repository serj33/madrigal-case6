<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madrigal TTS</title><link rel="stylesheet" href="/static/styles.css"></head><body><main><header><span>ЛОКАЛЬНЫЙ MVP</span><h1>Madrigal TTS</h1><p>Русская речь с прозрачным управлением произношением.</p></header><label for="text">Текст <small id="counter">0 / 2000</small></label><textarea id="text" maxlength="2000" placeholder="Введите русский текст…"></textarea><section class="actions"><button id="analyze">Проверить произношение</button><button id="base" class="secondary">BASE</button><button id="improved">IMPROVED</button><button id="auto">AUTO</button></section><p id="status" role="status"></p><section id="analysis" hidden><h2>Найденные неоднозначности</h2><p id="normalized"></p><div id="ambiguities"></div><div id="warnings"></div></section><section id="result" hidden><h2>Аудио</h2><audio id="player" controls></audio><a id="download" download>Скачать WAV</a><p id="metrics"></p><div id="auto-decisions"></div></section><section id="dictionary"><h2>Пользовательский словарь</h2><p>Произношение — слово со знаком <code>+</code> перед ударной гласной.</p><form id="dictionary-form"><label>Слово<input id="dictionary-word" required></label><div id="variant-fields"></div><button type="button" id="add-variant" class="secondary">Добавить вариант</button><button id="save-dictionary">Сохранить слово</button><button type="button" id="cancel-edit" class="secondary" hidden>Отменить редактирование</button></form><p id="dictionary-status" role="status"></p><div id="dictionary-entries"></div></section></main><script src="/static/app.js"></script></body></html>
