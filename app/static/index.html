<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Madrigal TTS</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main>
  <header>
    <span>ЛОКАЛЬНЫЙ СИНТЕЗ РЕЧИ</span>
    <h1>Madrigal TTS</h1>
    <p>Русская речь на базе Silero с автоматической подготовкой произношения.</p>
  </header>
  <label for="text">Текст <small id="counter">0 / 2000</small></label>
  <textarea id="text" maxlength="2000" placeholder="Введите русский текст…"></textarea>
  <section class="actions">
    <button id="base" class="secondary">BASE — исходный текст</button>
    <button id="auto">AUTO — автоматическая подготовка</button>
  </section>
  <p id="status" role="status"></p>
  <section id="result" hidden>
    <h2>Аудио</h2>
    <audio id="player" controls></audio>
    <p><a id="download" download>Скачать WAV</a></p>
    <p id="metrics"></p>
    <h3>Текст, переданный в синтезатор</h3>
    <pre id="text-used"></pre>
    <h3>Решения AUTO</h3>
    <div id="auto-decisions"></div>
    <p id="warnings"></p>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
